name: Playtest CI

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  # Set a consistent project name so Docker Compose generates predictable image names
  # Images will be named: scribblebeasts-client, scribblebeasts-server, etc.
  COMPOSE_PROJECT_NAME: scribblebeasts
  # Define the registry and owner for tagging images
  REGISTRY: ghcr.io
  # Define the repository URL for linking packages
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  # Job to lint the codebase
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: echo "Linting step is currently disabled."
        #run: npm run lint

  # Job to run unit tests
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck + unit/integration tests
        run: npm run verify

  # Runs the real Worker + Durable Object locally (workerd via wrangler dev,
  # no Cloudflare account needed) and plays full games against it with bots.
  worker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build:client

      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          cat wrangler.log; exit 1

      - name: Bot simulation against the Durable Object
        run: npm run sim -- --url ws://127.0.0.1:8787 --players 4

      - name: Print wrangler logs on failure
        if: failure()
        run: cat wrangler.log

  # Job to build the Docker images and run integration tests
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      # Build and start the services using Docker Compose
      # We build the images here. They will be tagged as scribblebeasts-client, scribblebeasts-server
      - name: Start services (Build & Test)
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: npm run playtest:run

      # Verify critical services are up
      - name: Check service status
        run: |
          echo "Checking status of services..."
          docker compose ps
          echo "All critical services started successfully!"

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.playtest.yml down

  # Job to deploy to Fly.io (only on push to main).
  # Set the repository variable DEPLOY_TARGET=cloudflare to switch to the
  # Cloudflare job below instead (see DEPLOY_CLOUDFLARE.md).
  deploy:
    runs-on: ubuntu-latest
    needs: [integration-test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TARGET != 'cloudflare'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: npm run deploy

  # Deploy to Cloudflare Workers (only on push to main, when DEPLOY_TARGET=cloudflare).
  # Needs secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + Workers Routes:Edit
  # + DNS:Edit for the zone) and CLOUDFLARE_ACCOUNT_ID.
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: [unit-test, worker-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TARGET == 'cloudflare'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
